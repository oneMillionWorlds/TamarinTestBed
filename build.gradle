import com.onemillionworlds.DeepTokenifyDirectory
import com.onemillionworlds.DeepTokenifyFile

plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation libs.tamarin
    implementation libs.jme3.effects
    implementation libs.jme3.core
    implementation libs.jme3.lwjgl3
    implementation libs.jme3.desktop
    implementation libs.jme3.plugins
    implementation libs.jme3.testdata
    implementation libs.deeptokens

    runtimeOnly libs.jme3.jogg

    implementation libs.lemur
    implementation libs.lemur.proto
    implementation libs.guava // <-- I don't understand why this is necessary as lemur brings it in, but the Selector dropdown won't work with out this
    implementation libs.groovy.all
    implementation libs.minie

    testImplementation libs.junit.jupiter.api
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.register("generateButtonPanel", DeepTokenifyFile){
    inputFile = file('deepTokenTemplates/buttonPanel.png')
    outputFile = file('src/main/generated/resources/Models/buttonPanel.j3o')
    tokenWidth = 2f
    tokenDepth = 0.05f
}

tasks.register("generateButtons", DeepTokenifyDirectory){
    inputDirectory = file('deepTokenTemplates/buttons')
    outputDirectory = file('src/main/generated/resources/Models/buttons')
    tokenWidth = 0.25f
    tokenDepth = 0.1f
}

test {
    useJUnitPlatform()
}

sourceSets.main.resources.srcDirs += 'src/main/generated/resources'

processResources.dependsOn(generateButtons)
processResources.dependsOn(generateButtonPanel)
