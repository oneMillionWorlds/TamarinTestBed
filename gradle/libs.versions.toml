[versions]
tamarin = "3.1.0"
jmonkeyengine = "3.9.0-stable"
deeptokens = "1.0.4"
lemur = "1.16.0"
lemur-proto = "1.13.0"
guava = "19.0"
groovy = "3.0.19"
minie = "8.2.0"
junit-jupiter = "5.7.0"
junit-platform = "1.7.0"

